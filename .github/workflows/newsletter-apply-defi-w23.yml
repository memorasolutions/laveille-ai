name: Newsletter — appliquer défi W23 + test (manuel, one-off)

# One-off : écrit content['wellness_challenge'] (défi #1) dans l'issue 2026 semaine 23
# sur prod (backup + merge, ne touche pas les autres clés), puis envoie un test.
# Le PHP est encodé en base64 pour éviter tout souci de quotes/accents via SSH.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse de réception du test"
        required: true
        default: "stephane@memora.ca"

jobs:
  apply-and-test:
    name: Appliquer défi W23 + envoi test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Écrire le défi dans l'issue W23 (backup + merge)
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php"

      - name: Envoyer le test du digest-weekly
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan newsletter:digest --test-email='${{ github.event.inputs.email }}' --force"
