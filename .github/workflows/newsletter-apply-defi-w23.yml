name: Newsletter — appliquer défi W23 + test (manuel, one-off v3)

# One-off v3 : défi bien-être + PROMPT ZERO-SHOT performant (weekly_prompt) +
# encadré "Pourquoi ce prompt fonctionne" dans l'issue 2026/semaine 23 (backup +
# merge non destructif), puis envoie un test. PHP encodé base64 pour le SSH.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse de réception du test"
        required: true
        default: "stephane@memora.ca"

jobs:
  apply-and-test:
    name: Appliquer défi W23 (prompt) + envoi test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Écrire le défi + prompt dans l'issue W23
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php"

      - name: Envoyer le test du digest-weekly
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan newsletter:digest --test-email='${{ github.event.inputs.email }}' --force"
