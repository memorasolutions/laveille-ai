name: Newsletter — appliquer défi W23 (manuel, one-off v2)

# One-off v2 : met à jour content['wellness_challenge'] (défi #1 + titre) dans
# l'issue 2026/semaine 23 sur prod (backup + merge non destructif). PAS d'envoi
# de test (déjà validé). PHP encodé base64 pour le transport SSH.

on:
  workflow_dispatch:

jobs:
  apply:
    name: Appliquer défi W23 (titre ajouté)
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Écrire le défi (avec titre) dans l'issue W23
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php"
