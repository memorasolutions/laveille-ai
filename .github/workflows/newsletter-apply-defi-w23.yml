name: Newsletter — appliquer défi W23 + test (manuel, one-off v4)

# One-off v4 : prompt zero-shot = 3 recettes notées /100 + justification, zéro achat
# épicerie. Met à jour l'issue 2026/semaine 23 (backup + merge non destructif) puis
# envoie un test. PHP encodé base64 pour le SSH.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse de réception du test"
        required: true
        default: "stephane@memora.ca"

jobs:
  apply-and-test:
    name: Appliquer défi W23 (3 recettes notées) + test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Écrire le défi + prompt (3 recettes) dans l'issue W23
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php"

      - name: Envoyer le test du digest-weekly
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan newsletter:digest --test-email='${{ github.event.inputs.email }}' --force"
