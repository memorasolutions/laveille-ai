name: Newsletter — appliquer outils W23 + test (manuel, one-off v5)

# One-off v5 : OUTIL DE LA SEMAINE = book-creator, OUTIL GRATUIT = sudoku.
# Résout les slugs sur prod + merge non destructif dans l'issue W23, puis test.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse de réception du test"
        required: true
        default: "stephane@memora.ca"

jobs:
  apply-and-test:
    name: Appliquer outils W23 + test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Écrire les outils (book-creator + sudoku) dans l'issue W23
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php"

      - name: Envoyer le test du digest-weekly
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan newsletter:digest --test-email='${{ github.event.inputs.email }}' --force"
