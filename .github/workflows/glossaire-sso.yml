name: Glossaire — insérer terme SSO (manuel, one-off)

# One-off : insère le terme « SSO » dans le glossaire prod (idempotent par slug),
# vide le response cache + purge la page sur Cloudflare. PHP encodé base64.

on:
  workflow_dispatch:

jobs:
  apply:
    name: Insérer terme SSO
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Insérer le terme + vider cache
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php && php artisan responsecache:clear && php artisan optimize:clear"

      - name: Purge Cloudflare (page + glossaire)
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://laveille.ai/glossaire/sso","https://laveille.ai/glossaire"]}' || true
