name: Glossaire — insérer terme YubiKey (manuel, one-off)

on:
  workflow_dispatch:

jobs:
  apply:
    name: Insérer terme YubiKey
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Insérer YubiKey + maj FIDO2 + vider cache
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php && php artisan responsecache:clear && php artisan optimize:clear"

      - name: Purge Cloudflare
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://laveille.ai/glossaire/yubikey","https://laveille.ai/glossaire/fido2","https://laveille.ai/glossaire"]}' || true
