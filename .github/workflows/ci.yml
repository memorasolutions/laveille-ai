name: CI

on:
  push:
    branches: [main, master, 'feature/*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_mysql, xml, ctype, json
          tools: composer
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style) - signalement seul, dette 2026-08-30 (1037 signalements)
        run: vendor/bin/pint --test || true

      - name: Larastan (static analysis level 6) - signalement seul, meme dette
        run: vendor/bin/phpstan analyse --memory-limit=512M || true

  tests:
    runs-on: ubuntu-latest
    # 50 min, pas 30 : un premier plafond de 30 a tue le job par timeout (pas par un echec de
    # test) sur un run reel du 2026-08-30 - la suite complete mesure 2204,87 s (36,7 min) sur ce
    # runner. 50 min laisse une marge reelle plutot qu'un plafond qui coupe la mesure elle-meme.
    timeout-minutes: 50
    continue-on-error: true

    # Pas de service MySQL ici : phpunit.xml force DB_CONNECTION=sqlite (:memory:) pour la suite
    # de tests, exactement comme en local. Un service MySQL + "php artisan migrate --force" fut
    # tente le 2026-08-30 : il echoue systematiquement sur une contrainte preexistante et sans
    # rapport avec le code teste (2026_03_02_600003_create_url_redirects_table : unique() sur
    # une colonne string(2048) en utf8mb4 = 8192 octets, largement au-dessus de la limite dure
    # InnoDB de 3072 octets). Documente pour suivi separe - hors perimetre de cette porte de CI.
    #
    # continue-on-error : signalement seul, PAS un blocage. Premiere execution reelle de ce job
    # (2026-08-30, jamais reussie une seule fois en 556 runs historiques) : 74 tests en echec sur
    # ~6600+, tous par des causes preexistantes et sans rapport avec un push donne - dont une
    # decouverte systemique : ~48 modules declarent "Modules\X\Database\Seeders\Y" en namespace
    # mais rangent le fichier dans "database/seeders/" (minuscule) - PSR-4 est sensible a la casse,
    # macOS (poste de developpement) est insensible a la casse et masque le bogue depuis toujours,
    # Linux (ce runner) ne le masque pas. Corriger les ~48 modules est un chantier a part, pas un
    # correctif de porte de CI. Faire tourner cette porte MAINTENANT, meme rouge sur de la dette
    # connue, vaut mieux que la garder eteinte en attendant un vert parfait.
    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, xml, ctype, json, intl, bcmath, gd
          coverage: none
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: npm ci

      - run: npm run build

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Run tests
        run: php artisan test --parallel

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests
    if: github.event_name == 'pull_request'
    continue-on-error: true

    # SQLite fichier (pas :memory: - le serveur artisan et les commandes migrate/seed sont des
    # process separes qui doivent partager le meme fichier) plutot qu'un service MySQL, pour la
    # meme raison que le job tests : evite la contrainte InnoDB 3072 octets documentee plus haut.
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/laveille-e2e-testing.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, xml, ctype, json, intl, bcmath, gd
          coverage: none
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch /tmp/laveille-e2e-testing.sqlite
      - run: php artisan migrate --force

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed E2E users
        run: php tests/e2e/seed-e2e-users.php

      - name: Start server
        run: php artisan serve --port=8000 &

      - name: Wait for server
        run: sleep 3

      - name: Run Playwright tests
        run: npx playwright test tests/e2e/ --reporter=list
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit - signalement seul (CVE transitives, meme traitement que npm audit)
        run: composer audit || true

      - name: NPM audit
        run: npm audit --audit-level=moderate || true
