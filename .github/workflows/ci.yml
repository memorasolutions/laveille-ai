name: CI

on:
  push:
    branches: [main, master, 'feature/*']
    # 2026-08-31 (ticket #2095) : identique au paths-ignore historique de deploy.yml (2026-08-23,
    # « un commit de documentation seule ne doit plus déployer »). Le déploiement se déclenche
    # désormais via workflow_run sur CETTE CI (voir deploy.yml) : si la CI ne tourne pas sur un
    # commit de documentation seule, deploy.yml ne se déclenche pas non plus - même protection,
    # une seule source de vérité, pas de filtre dupliqué à deux endroits.
    paths-ignore:
      - 'QUESTIONS-CLAUDE.html'
      - 'QUESTIONS-CLAUDE.html.bak-*'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_mysql, xml, ctype, json
          tools: composer
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (code style) - signalement seul, dette 2026-08-30 (1037 signalements)
        run: vendor/bin/pint --test || true

      - name: Larastan (static analysis level 6) - signalement seul, meme dette
        run: vendor/bin/phpstan analyse --memory-limit=512M || true

  # Ticket #2095 - ce job remplace l'ancien job "tests" (suite complète, 36-39 min,
  # continue-on-error: true). Ce drapeau masquait des échecs réels : mesuré sur 2 runs GitHub
  # Actions distincts (33337672499 du 2026-08-30, 33399133405 du 2026-08-31) où le job "tests"
  # était en conclusion "failure" PENDANT que le workflow entier rapportait "success" - aucun
  # commit cassé n'a jamais été bloqué par ce job. Voir docs/specs/2026-08-31-ci-deploy-gating-
  # decision.md pour la mesure complète et le club des sages qui a tranché ce chantier.
  #
  # Composition du sous-ensemble (testsuites Architecture+Unit + groupe Pest "smoke"), MESURÉE
  # le 2026-08-31, jamais supposée : 198 tests / 525 assertions, 0 échec sur 6 exécutions
  # indépendantes (3x Architecture+Unit : 40.33s/41.00s/40.51s ; 3x groupe smoke :
  # 61.14s/61.01s/60.88s). Vérifié aussi contre un run GitHub Actions Linux réel
  # (33399133405) : les 2 fichiers du groupe smoke y passent déjà, seul BlogAdminTest (hors de ce
  # sous-ensemble) y a échoué. Budget total mesuré environ 100 secondes d'exécution de tests,
  # très sous les 10 minutes cibles.
  #
  # Choix du contenu : pas une nouvelle suite inventée, seulement des tests EXISTANTS déjà
  # stables, choisis parce qu'ils auraient attrapé les vrais défauts de production de la semaine
  # du 2026-08-23 au 2026-08-31 - jamais choisis pour leur seule rapidité :
  #   - Architecture (testsuite complète) : ConfigCacheForbiddenTest (la commande interdite
  #     config:cache) + TranslatableSlugFallbackTest (le repli de construction d'adresse qui avait
  #     cassé le plan de site en juillet, retrouvé ailleurs le 2026-08-31)
  #   - Unit (testsuite complète) : aides de typographie française
  #   - Groupe "smoke" (Pest ->group('smoke')) : GlossaryLinkifierTest (frontière des
  #     correspondances de noms de l'auto-lien du glossaire - zone de 3 correctifs réels entre le
  #     2026-08-23 et le 2026-08-28) + NewsApplyCommandTest (seule porte d'écriture bornée de la
  #     composition d'actualités - résumé riche effacé à deux reprises en production, 2026-08-26
  #     et 2026-08-28)
  #
  # Exécution en SÉRIE, jamais --parallel. Mesure réelle du 2026-08-31 : le mode parallèle
  # n'apporte aucun gain sur ce sous-ensemble restreint (61.14s en parallèle contre 61.01s/60.88s
  # en série sur 3 exécutions - l'écart tient au démarrage de paratest, pas au travail utile). Le
  # mode série élimine par construction toute la classe de course déjà mesurée dans ce projet :
  # Phase155Test et TranslationModuleTest écrivaient tous deux dans les mêmes lang/fr.json et
  # lang/en.json réels sous workers Paratest concurrents (diagnostiqué et corrigé le 2026-08-30,
  # commits cbbfe6b0/3d53e53c - reconfirmé stable ici par 2 exécutions parallèles indépendantes,
  # 27/27 tests verts chaque fois). La suite complète (36-39 min, 6600+ tests, mode parallèle par
  # défaut) continue de tourner chaque nuit dans nightly-tests.yml, jamais sur le chemin critique
  # du déploiement - y compris pour diagnostiquer une flakiness résiduelle distincte (ex.
  # BlogAdminTest, "No hint path defined for [fronttheme]", non reproduite sur 4 exécutions
  # isolées le 2026-08-31 - piste ouverte, pas une régression de ce sas).
  #
  # Aucun continue-on-error : zéro tolérance, ce job doit pouvoir réellement faire échouer le
  # workflow (et donc bloquer le déploiement, voir deploy.yml).
  smoke:
    name: Sas rapide (bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: testing
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, xml, ctype, json, intl, bcmath, gd
          coverage: none
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: npm ci

      - run: npm run build

      - run: cp .env.example .env

      - run: php artisan key:generate

      - name: Architecture + Unit (testsuites complètes)
        run: php artisan test --testsuite=Architecture,Unit

      - name: Sous-ensemble Feature/Modules marqué smoke
        run: php artisan test --group=smoke

  # e2e est MORT dans le flux réel de ce dépôt (mesuré le 2026-08-31, ticket #2095) : ce job ne se
  # déclenche que sur pull_request, et ce dépôt ne travaille jamais par PR (gh pr list --state all
  # ne montre que Dependabot et une branche d'audit ancienne). Dernière exécution de ci.yml sur
  # événement pull_request : mars 2026, 100% en échec. Il ne protège donc rien dans le flux de
  # livraison actuel. Laissé tel quel (le réanimer - le brancher sur push, ou le retirer
  # entièrement - est un chantier distinct, hors périmètre de #2095), mais désormais NOMMÉ comme
  # dormant plutôt que compté silencieusement comme une protection active.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    if: github.event_name == 'pull_request'
    continue-on-error: true

    # SQLite fichier (pas :memory: - le serveur artisan et les commandes migrate/seed sont des
    # process separes qui doivent partager le meme fichier) plutot qu'un service MySQL, pour la
    # meme raison que le job tests : evite la contrainte InnoDB 3072 octets documentee plus haut.
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/laveille-e2e-testing.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, xml, ctype, json, intl, bcmath, gd
          coverage: none
          tools: composer

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch /tmp/laveille-e2e-testing.sqlite
      - run: php artisan migrate --force

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed E2E users
        run: php tests/e2e/seed-e2e-users.php

      - name: Start server
        run: php artisan serve --port=8000 &

      - name: Wait for server
        run: sleep 3

      - name: Run Playwright tests
        run: npx playwright test tests/e2e/ --reporter=list
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit - signalement seul (CVE transitives, meme traitement que npm audit)
        run: composer audit || true

      - name: NPM audit
        run: npm audit --audit-level=moderate || true
