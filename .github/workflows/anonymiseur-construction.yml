name: Outils — anonymiseur « en construction » (manuel, one-off)

# One-off : passe l'anonymiseur en is_under_construction=true sur prod
# (public → page « En construction », super-admin garde l'accès), puis vide
# le response cache + purge la page sur Cloudflare. PHP encodé base64.

on:
  workflow_dispatch:

jobs:
  apply:
    name: Anonymiseur en construction
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Activer is_under_construction + vider cache
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php && php artisan responsecache:clear && php artisan optimize:clear"

      - name: Purge Cloudflare (page anonymiseur)
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://laveille.ai/outils/anonymiseur"]}' || true
