name: Glossaire — insérer terme MFA (manuel, one-off)

# One-off : insère « MFA » + lie au 2FA (knowledge graph) sur prod (idempotent),
# vide le response cache + purge Cloudflare. PHP encodé base64.

on:
  workflow_dispatch:

jobs:
  apply:
    name: Insérer terme MFA
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Insérer MFA + lien 2FA + vider cache
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '' | base64 -d | php && php artisan responsecache:clear && php artisan optimize:clear"

      - name: Purge Cloudflare
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://laveille.ai/glossaire/mfa","https://laveille.ai/glossaire/2fa","https://laveille.ai/glossaire"]}' || true
