name: Maintenance ponctuelle 2026-08-07 (preuve journal prod)

# ACTION: workflow TEMPORAIRE (a retirer apres usage) - lit la fin du journal Laravel prod
#   pour prouver que l'erreur « The force option does not exist » (workers de queue perimes)
#   a cesse apres l'ajout de queue:restart au deploiement.
# RAISON: le port SSH est filtre depuis les postes locaux, seuls les runners y accedent.

on:
  workflow_dispatch:

jobs:
  check:
    name: Preuve journal prod
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Occurrences de l erreur force (avant vs apres 13h58 UTC)
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && echo '--- dernieres occurrences (heure UTC) ---' && grep -n 'force.*option does not exist' storage/logs/laravel.log | tail -5 && echo '--- fin du journal (3 dernieres lignes horodatees) ---' && grep -oE '^\[[0-9T:. -]+\]' storage/logs/laravel.log | tail -3 && echo '--- heure serveur ---' && date -u"
