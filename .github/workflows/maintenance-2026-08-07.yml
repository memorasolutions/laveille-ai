name: Maintenance ponctuelle 2026-08-07 (preuve journal prod)

# ACTION: workflow TEMPORAIRE (a retirer apres usage) - lit le journal QUOTIDIEN du jour
#   pour prouver que l'erreur « The force option does not exist » (workers de queue perimes)
#   a cesse apres l'ajout de queue:restart au deploiement, et retire 3 fichiers temporaires
#   residuels du diagnostic sitemap de la veille (tmp_sitemap_*).
# RAISON: le port SSH est filtre depuis les postes locaux, seuls les runners y accedent.

on:
  workflow_dispatch:

jobs:
  check:
    name: Preuve journal prod
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Occurrences force dans le journal quotidien du jour
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai/storage/logs && L=laravel-\$(date -u +%F).log && echo \"fichier: \$L\" && echo '--- 5 dernieres occurrences (heure UTC) ---' && grep -n 'force.*option does not exist' \"\$L\" | tail -5 && echo '--- derniere ligne horodatee du journal ---' && grep -oE '^\[[0-9T:. -]+\]' \"\$L\" | tail -1 && echo '--- heure serveur ---' && date -u"

      - name: Nettoyage fichiers temporaires residuels (diagnostic sitemap 2026-08-06)
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai/storage/logs && rm -f tmp_sitemap_tail.txt tmp_sitemap_linecount.txt tmp_sitemap_matches.txt && ls tmp_sitemap_* 2>/dev/null || echo 'tmp_sitemap_* supprimes'"
