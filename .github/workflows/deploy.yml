name: Deploy to cPanel via rsync/SSH

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        # NOTE (incident P0 2026-07-11) : ce rsync n'a volontairement PAS de --delete/--delete-after.
        #   Un fichier de migration supprimé de git (commit 9502674a) est resté physiquement en
        #   prod et a bloqué migrate --force (cf. étape suivante) — symptôme direct de cette
        #   absence de synchronisation des suppressions. Vérifié le 2026-07-11 si --delete pouvait
        #   être activé sans risque : NON, car public/fonts/ (police Caveat self-hébergée,
        #   v1.104.0) est présent en prod, gitignoré localement (.gitignore: `/public/fonts`),
        #   et N'EST PAS dans la liste --exclude ci-dessous → --delete le supprimerait au
        #   prochain déploiement (police cassée site-wide). Idem pour d'éventuels autres chemins
        #   gitignorés-mais-nécessaires-en-prod (public/hot, public/storage). Pour activer
        #   --delete un jour : ajouter --exclude='public/fonts/' --exclude='public/hot'
        #   --exclude='public/storage' (+ auditer tout autre chemin gitignore non exclu ici) et
        #   tester d'abord avec `rsync --delete --dry-run` en observant la liste de suppression.
        run: |
          rsync -azP \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='public/screenshots/' \
            --exclude='bootstrap/cache/' \
            --exclude='tests/' \
            --exclude='public/_*.php' \
            --exclude='/_*.php' \
            --exclude='*.log' \
            --exclude='error_log' \
            ./ gmemora@server.memora.pro:/home/gmemora/public_html/apps_diverses/laveille.ai/

      - name: Install composer dependencies on server
        # ACTION: composer install --no-dev après chaque déploiement.
        # RAISON (incident 2026-07-02) : vendor/ est exclu du rsync (ci-dessus) et AUCUNE étape
        #   de ce pipeline n'installait les dépendances composer côté serveur — un composer.lock
        #   modifié (ex. ajout de google/apiclient pour l'auto-création Google Meet) se déployait
        #   sans jamais installer le paquet, causant un "Class ... not found" fatal (500) sur
        #   toute page chargeant la classe manquante. Root-causé et corrigé manuellement le jour
        #   même (composer.phar téléchargé + installé via SSH), mais SANS cette étape le même
        #   bug reviendrait à chaque nouvelle dépendance composer future. Self-healing : utilise
        #   composer.phar déjà présent sur le serveur, sinon le télécharge.
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && \
            (test -f composer.phar || curl -sS https://getcomposer.org/composer-stable.phar -o composer.phar) && \
            php composer.phar install --no-dev --optimize-autoloader --no-interaction --no-scripts" || true

      - name: Run pending migrations (additive only, --force pour skip prompt prod)
        # ACTION: retrait du `|| true`, ajout d'un timeout 300s autour de `migrate --force`.
        # RAISON (incident P0 2026-07-11) : un fichier de migration devenu zombie (supprimé de
        #   git au commit 9502674a mais jamais retiré du serveur, faute de --delete sur rsync
        #   ci-dessus) contenait un chunkById() non borné qui a fait timeout cette étape à
        #   CHAQUE déploiement depuis son introduction. Le `|| true` original (ajouté 2026-05-03,
        #   fix L15, pour ne jamais faire échouer tout le pipeline sur une migration) a masqué
        #   cet échec silencieusement, empêchant TOUTES les migrations postérieures de s'exécuter
        #   — dont les 3 migrations du module Journal (2026-07-11) — et causant une 500 en prod
        #   pour tout utilisateur connecté (table `journals` inexistante). `timeout 300` reprend
        #   l'intention originale du `|| true` (ne pas laisser un futur backfill non borné
        #   bloquer indéfiniment le pipeline) SANS masquer l'échec : au-delà de 5 min ou sur
        #   toute autre erreur, `migrate --force` fait maintenant échouer le job CI visiblement.
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && timeout 300 php artisan migrate --force"

      - name: Clear caches on server
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan optimize:clear; php artisan responsecache:clear" || true

      - name: Build caches prod (route+event+view — JAMAIS config:cache)
        # ACTION: caches sûrs uniquement, on retire config:cache (php artisan optimize).
        # MCP: SELF (diff < 5 lignes)
        # RAISON: config:cache a silencieusement REFERMÉ l'Académie en prod (le middleware
        #   AcademyUnderConstruction ne lisait plus ACADEMY_UNDER_CONSTRUCTION=false du .env :
        #   tout env() devient null une fois la config cachée). Risque latent sur tout env()
        #   non migré (vendor/runtime). On garde donc route/event/view (sans env()), et la
        #   config reste lue en direct depuis le .env. OptimizedApp restera partiellement rouge
        #   (P3 cosmétique) — acceptable vs régression silencieuse. NE PAS réactiver config:cache
        #   sans audit exhaustif de TOUS les env() (app + vendor + runtime).
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan route:cache && php artisan event:cache && php artisan view:cache" || true

      - name: Purge Cloudflare cache
        # Token scopé "Cache Purge" limité à la zone laveille.ai (jamais la Global API Key).
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

      - name: Deploy notification
        run: |
          echo "::notice::Deploy rsync/SSH termine avec succes vers server.memora.pro"
          echo "Deploye le $(date -u '+%Y-%m-%d %H:%M:%S UTC') depuis le commit ${{ github.sha }}"
