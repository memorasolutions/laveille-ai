name: Deploy to cPanel via rsync/SSH

# Ticket #2095 (2026-08-31) : le déclenchement direct sur push est retiré. Avant ce chantier,
# deploy.yml et ci.yml étaient deux workflows indépendants déclenchés par le MÊME push, sans
# qu'aucun des deux ne consulte l'autre - même quand la CI tournait jusqu'au bout, son job de
# tests portait continue-on-error: true et ne pouvait donc jamais faire échouer le passage.
# Mesuré : rien n'a jamais empêché un commit cassé de partir en production. Détail complet et
# club des sages qui a tranché ce chantier : docs/specs/2026-08-31-ci-deploy-gating-decision.md.
#
# Le déclenchement passe désormais par workflow_run sur le workflow "CI" : ce job n'évalue les
# étapes suivantes QUE si cette CI (voir ci.yml, job "smoke") a réellement terminé en succès - et
# épingle explicitement le head_sha exact rapporté par cet événement (jamais un checkout
# implicite de la branche courante), pour fermer la course suivante : sous cancel-in-progress et
# cadence rapide de push, l'approbation du sas pour un push A pourrait sinon autoriser le
# déploiement d'un push B plus récent et jamais testé.
#
# La protection historique « un commit de documentation seule ne doit plus déployer »
# (2026-08-23 : 4 déploiements sur 12 ne portaient aucun changement de code, chacun coûtant au
# site une fenêtre de maintenance pour rien) vit désormais dans le paths-ignore de ci.yml : si la
# CI ne tourne pas sur un commit donné, cet événement workflow_run ne se déclenche pas non plus
# pour ce commit - une seule source de vérité, jamais un filtre dupliqué à deux endroits.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  # Reste disponible pour forcer un déploiement à la main en cas de doute - contournement
  # volontaire et assumé du sas, c'est le sens même d'un déclenchement manuel.
  workflow_dispatch:

# File stricte, JAMAIS d'annulation en cours de transfert. rsync n'est pas une opération atomique
# (voir l'étape "Deploy via rsync" plus bas) : interrompre un déploiement en cours de transfert
# laisserait le répertoire de production dans un état mi-copié - une casse immédiate, pire que le
# problème que cette file résout. cancel-in-progress reste donc à false (la valeur par défaut),
# écrit ici explicitement pour qu'un futur changement ne le relâche pas par inadvertance. Une
# rafale de push se résorbe naturellement une fois le sas amont ramené sous 10 minutes (voir
# ci.yml) : plus de rafale à absorber au niveau du déploiement lui-même.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Un déclenchement manuel (workflow_dispatch) est toujours autorisé - contournement
    # volontaire du sas. Un déclenchement par workflow_run n'autorise le déploiement QUE si la CI
    # rapporte réellement "success" (jamais "failure", "cancelled", ni aucun autre état).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Déterminer le commit exact à déployer
        # Le SHA exact rapporté par l'événement CI - jamais github.sha implicite, qui pour un
        # déclenchement workflow_run refléterait la branche courante au moment de CET événement,
        # potentiellement plus récente que ce qui a été réellement testé (exactement la course
        # documentée en tête de fichier). Pour un déclenchement manuel, github.sha correspond à
        # la branche demandée au moment du dispatch - comportement voulu, aucun sas à respecter.
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "DEPLOY_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H server.memora.pro >> ~/.ssh/known_hosts

      - name: Enable maintenance mode (ferme la fenetre de race condition rsync/cache)
        # ACTION: php artisan down avant rsync, up (if: always) apres la reconstruction des caches.
        # RAISON (incident 2026-07-17, v1.109.0) : rsync deploie les nouvelles vues AVANT que
        #   route:cache/view:cache ne soient reconstruits (etapes separees, plusieurs secondes
        #   d'ecart). Une requete tombant pile dans cette fenetre voit une vue qui appelle
        #   route('decido.create.date') alors que le cache de routes encore actif est l'ANCIEN
        #   (sans cette route) -> RouteNotFoundException -> 500 en prod. Confirme par les logs :
        #   erreur a 12:33:56 UTC, cache de routes reconstruit a 12:34:02 UTC (6s d'ecart exact).
        #   Envelopper tout le déploiement (rsync + composer + migrate + caches) dans une courte
        #   fenetre de maintenance elimine cette classe entiere de race condition, pas seulement
        #   le cas des routes (idem colonnes de migration pas encore appliquees, etc.).
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan down --retry=15" || true

      - name: Deploy via rsync
        # NOTE (incident P0 2026-07-11) : ce rsync n'a volontairement PAS de --delete/--delete-after.
        #   Un fichier de migration supprimé de git (commit 9502674a) est resté physiquement en
        #   prod et a bloqué migrate --force (cf. étape suivante) — symptôme direct de cette
        #   absence de synchronisation des suppressions. Vérifié le 2026-07-11 si --delete pouvait
        #   être activé sans risque : NON, car public/fonts/ (police Caveat self-hébergée,
        #   v1.104.0) est présent en prod, gitignoré localement (.gitignore: `/public/fonts`),
        #   et N'EST PAS dans la liste --exclude ci-dessous → --delete le supprimerait au
        #   prochain déploiement (police cassée site-wide). Idem pour d'éventuels autres chemins
        #   gitignorés-mais-nécessaires-en-prod (public/hot, public/storage). Pour activer
        #   --delete un jour : ajouter --exclude='public/fonts/' --exclude='public/hot'
        #   --exclude='public/storage' (+ auditer tout autre chemin gitignore non exclu ici) et
        #   tester d'abord avec `rsync --delete --dry-run` en observant la liste de suppression.
        run: |
          rsync -azP \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/vendor/' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='public/screenshots/' \
            --exclude='bootstrap/cache/' \
            --exclude='tests/' \
            --exclude='public/_*.php' \
            --exclude='/_*.php' \
            --exclude='*.log' \
            --exclude='error_log' \
            ./ gmemora@server.memora.pro:/home/gmemora/public_html/apps_diverses/laveille.ai/

      - name: Install composer dependencies on server
        # ACTION: composer install --no-dev après chaque déploiement.
        # RAISON (incident 2026-07-02) : vendor/ est exclu du rsync (ci-dessus) et AUCUNE étape
        #   de ce pipeline n'installait les dépendances composer côté serveur — un composer.lock
        #   modifié (ex. ajout de google/apiclient pour l'auto-création Google Meet) se déployait
        #   sans jamais installer le paquet, causant un "Class ... not found" fatal (500) sur
        #   toute page chargeant la classe manquante. Root-causé et corrigé manuellement le jour
        #   même (composer.phar téléchargé + installé via SSH), mais SANS cette étape le même
        #   bug reviendrait à chaque nouvelle dépendance composer future. Self-healing : utilise
        #   composer.phar déjà présent sur le serveur, sinon le télécharge.
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && \
            (test -f composer.phar || curl -sS https://getcomposer.org/composer-stable.phar -o composer.phar) && \
            php composer.phar install --no-dev --optimize-autoloader --no-interaction --no-scripts" || true

      - name: Run pending migrations (additive only, --force pour skip prompt prod)
        # ACTION: retrait du `|| true`, ajout d'un timeout 300s autour de `migrate --force`.
        # RAISON (incident P0 2026-07-11) : un fichier de migration devenu zombie (supprimé de
        #   git au commit 9502674a mais jamais retiré du serveur, faute de --delete sur rsync
        #   ci-dessus) contenait un chunkById() non borné qui a fait timeout cette étape à
        #   CHAQUE déploiement depuis son introduction. Le `|| true` original (ajouté 2026-05-03,
        #   fix L15, pour ne jamais faire échouer tout le pipeline sur une migration) a masqué
        #   cet échec silencieusement, empêchant TOUTES les migrations postérieures de s'exécuter
        #   — dont les 3 migrations du module Journal (2026-07-11) — et causant une 500 en prod
        #   pour tout utilisateur connecté (table `journals` inexistante). `timeout 300` reprend
        #   l'intention originale du `|| true` (ne pas laisser un futur backfill non borné
        #   bloquer indéfiniment le pipeline) SANS masquer l'échec : au-delà de 5 min ou sur
        #   toute autre erreur, `migrate --force` fait maintenant échouer le job CI visiblement.
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && timeout 300 php artisan migrate --force"

      - name: Clear caches on server
        # ACTION: optimize:clear --except=routes (ticket #2096).
        # MCP: SELF (diff < 5 lignes)
        # RAISON: optimize:clear supprime le cache des routes (route:clear interne) SANS le
        #   reconstruire - la reconstruction n'a lieu que dans l'etape "Build caches prod",
        #   plus bas, separee de celle-ci par une etape entiere (reamorçage du heartbeat) et
        #   une deuxieme connexion SSH. Le fichier bootstrap/cache/routes-v7.php restait donc
        #   ABSENT du disque pendant toute cette fenetre (plusieurs secondes), et toute requete
        #   qui demarrait l'application durant ce laps (visiteur, ou tache planifiee - le
        #   planificateur tourne CHAQUE MINUTE et n'est pas bloque par le mode maintenance)
        #   pouvait essuyer une erreur fatale. On exclut donc "routes" ici : l'ancien cache
        #   reste actif et valide jusqu'a ce que route:cache-atomic le bascule d'un seul coup
        #   plus bas (rename() atomique, cf. app/Console/Commands/RouteCacheAtomicCommand.php).
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan optimize:clear --except=routes; php artisan health:schedule-check-heartbeat; php artisan responsecache:clear; php artisan queue:restart" || true

      - name: Réamorcer le battement de coeur du planificateur
        # ACTION: reposer immediatement le heartbeat efface par optimize:clear.
        # MCP: SELF (diff < 5 lignes)
        # RAISON: optimize:clear vide le cache, donc la marque de passage du planificateur.
        #   Le controle de sante suivant (il tourne chaque minute) voyait « The schedule did
        #   not run yet » et envoyait une alerte URGENT a CHAQUE mise en ligne. Constate en
        #   production le 2026-08-01 a 16h29 Quebec (20:29 UTC), deux minutes apres un deploy.
        #   Une alerte qui sonne a chaque deploiement finit par etre ignoree le jour ou elle
        #   signale un vrai arret du planificateur.
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan health:schedule-check-heartbeat" || true

      - name: Build caches prod (route+event+view — JAMAIS config:cache)
        # ACTION: caches sûrs uniquement, on retire config:cache (php artisan optimize).
        # MCP: SELF (diff < 5 lignes)
        # RAISON: config:cache a silencieusement REFERMÉ l'Académie en prod (le middleware
        #   AcademyUnderConstruction ne lisait plus ACADEMY_UNDER_CONSTRUCTION=false du .env :
        #   tout env() devient null une fois la config cachée). Risque latent sur tout env()
        #   non migré (vendor/runtime). On garde donc route/event/view (sans env()), et la
        #   config reste lue en direct depuis le .env. OptimizedApp restera partiellement rouge
        #   (P3 cosmétique) — acceptable vs régression silencieuse. NE PAS réactiver config:cache
        #   sans audit exhaustif de TOUS les env() (app + vendor + runtime).
        # RAISON (ticket #2096, complète la note ci-dessus) : route:cache (natif Laravel)
        #   supprime d'abord le fichier de cache puis reboote toute l'application avant de le
        #   reecrire - fenetre de plusieurs secondes ou le fichier cible est absent, aggravee
        #   ici par la separation d'etapes deja documentee sur "Clear caches on server". On
        #   appelle donc route:cache-atomic (app/Console/Commands/RouteCacheAtomicCommand.php),
        #   qui ecarte l'ancien cache, reconstruit, puis bascule via Filesystem::replace() -
        #   ecriture dans un fichier temporaire du meme dossier suivi d'un rename() atomique,
        #   le fichier cible n'est jamais absent plus que la duree de ce seul appel systeme.
        #   event:cache et view:cache restent inchangees (hors perimetre de ce ticket).
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan route:cache-atomic && php artisan event:cache && php artisan view:cache" || true

      - name: Disable maintenance mode
        # if: always() -> le site ne reste JAMAIS bloque en mode maintenance meme si une etape
        #   precedente (migrate, composer) a echoue et fait sauter le reste du job.
        if: always()
        run: |
          ssh gmemora@server.memora.pro "cd /home/gmemora/public_html/apps_diverses/laveille.ai && php artisan up" || true

      - name: Purge Cloudflare cache
        # Token scopé "Cache Purge" limité à la zone laveille.ai (jamais la Global API Key).
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true

      - name: Deploy notification
        # DEPLOY_SHA (jamais github.sha, voir l'étape "Déterminer le commit exact à déployer" en
        # tête de job) : c'est le commit réellement testé par le sas CI qui est journalisé ici,
        # pas nécessairement la branche courante au moment de ce workflow.
        run: |
          echo "::notice::Deploy rsync/SSH termine avec succes vers server.memora.pro"
          echo "Deploye le $(date -u '+%Y-%m-%d %H:%M:%S UTC') depuis le commit ${{ env.DEPLOY_SHA }}"
