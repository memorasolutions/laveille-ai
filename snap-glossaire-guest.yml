            - time [ref=e138]: 6 juillet 2026
          - paragraph [ref=e141]: Le Data Privacy Framework est le cadre juridique actuel permettant les transferts de données personnelles de l'UE vers les États-Unis, sous conditions de certification et de recours.
          - generic [ref=e143]:
            - heading "📖 Définition" [level=2] [ref=e144]
            - generic [ref=e145]: Le Data Privacy Framework (DPF) est le troisième mécanisme de transfert transatlantique de données personnelles entre l'Union européenne et les États-Unis, après Safe Harbor et Privacy Shield, tous deux annulés par la Cour de justice de l'UE (arrêts Schrems I et II). Adopté par la Commission européenne le 10 juillet 2023 au titre de l'article 45 du RGPD, il combine l'auto-certification des entreprises américaines - surveillée par la Federal Trade Commission - avec les garanties du décret présidentiel Executive Order 14086, qui limite l'accès du renseignement américain aux données européennes. Les plaintes passent d'abord par le Civil Liberties Protection Officer, puis par la Data Protection Review Court, une cour indépendante aux décisions contraignantes. Étendu à l'Espace économique européen et à la Suisse en 2024, le cadre a résisté à un recours en annulation devant le Tribunal de l'UE en septembre 2025, mais un pourvoi reste pendant devant la CJUE. En juillet 2026, une décision de la Cour suprême américaine sur l'indépendance de la FTC (Trump v. Slaughter) relance les doutes sur sa stabilité à long terme.
          - generic [ref=e146]:
            - generic [ref=e148]:
              - heading "💬 En termes simples" [level=2] [ref=e149]
              - paragraph [ref=e150]: C'est un pont transatlantique pour données, avec certification obligatoire, surveillance de la FTC et un tribunal indépendant pour les recours.
            - generic [ref=e152]:
              - heading "🎯 Exemple concret" [level=2] [ref=e153]
              - paragraph [ref=e154]: Un fournisseur de services cloud américain certifié DPF peut recevoir des données personnelles d'une entreprise européenne sans clauses contractuelles types supplémentaires.
            - generic [ref=e156]:
