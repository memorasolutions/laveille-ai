# Author: MEMORA solutions, https://memora.solutions ; info@memora.ca
# Assets Vite fingerprintés (/build/) : le nom de chaque fichier change dès que son contenu
# change (hash Vite dans le nom), donc une URL /build/... donnée ne sert JAMAIS deux contenus
# différents. On peut donc les mettre en cache le plus longtemps possible côté navigateur/CDN,
# avec "immutable" pour éviter toute revalidation inutile (304) sur des fichiers qui ne changeront
# jamais. Portée strictement limitée à ce répertoire (n'affecte pas le reste du site — voir
# public/.htaccess pour la politique de cache générale ExpiresByType).
<IfModule mod_headers.c>
    <FilesMatch ".*">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>


    # EXCEPTION indispensable, ajoutée le 2026-09-21 : sw-source.js est un SERVICE WORKER, donc
    # le seul fichier de ce répertoire dont le nom ne change PAS quand son contenu change. C'est
    # l'adresse fixe que les navigateurs interrogent pour détecter une mise à jour. Servi en
    # « immutable » pour un an, il reste figé chez chaque visiteur ET dans le cache d'edge de
    # Cloudflare (mesuré : cf-cache-status HIT, age 1246 s), ce qui rendrait toute correction
    # ultérieure inopérante sans qu'aucun signal ne le montre côté serveur.
    # En Apache, la directive la plus spécifique doit venir APRÈS pour gagner.
    <FilesMatch "^sw-source\.js$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>
