          - paragraph [ref=e143]: "La 5G est la cinquième génération de réseau mobile : plus rapide et plus réactive que la 4G, elle est idéale pour le streaming, le jeu en ligne et l'Internet des objets."
          - generic [ref=e145]:
            - heading "📖 Définition" [level=2] [ref=e146]
            - generic [ref=e147]:
              - text: La 5G est la cinquième génération des réseaux de téléphonie mobile, déployée commercialement à partir de 2019-2020. Elle succède à la 4G LTE et transforme la connectivité sans fil. Concrètement, la 5G offre des débits de téléchargement nettement plus rapides que la 4G, ce qui permet de télécharger un film en haute définition en quelques secondes. Mais son vrai atout, c'est la
              - link "Latence — voir glossaire (nouvel onglet)" [ref=e148]:
                - /url: /glossaire/latence
                - text: latence
              - text: ultra-faible (le temps de réponse entre l'envoi et la réception d'un signal), qui peut descendre sous la milliseconde dans les meilleures conditions, contre plusieurs dizaines de millisecondes pour la 4G. Cette réactivité est cruciale pour des applications comme la chirurgie à distance, les voitures autonomes ou le jeu vidéo en nuage sans décalage. La 5G peut aussi connecter un très grand nombre d'objets simultanément sur une même zone, ce qui la rend incontournable pour l'Internet des objets (IoT) et les villes intelligentes. Pour y arriver, elle utilise plusieurs bandes de fréquences, dont les ondes millimétriques (très hautes fréquences) qui transportent beaucoup de données mais sur de courtes distances, d'où le besoin d'installer plus d'antennes. La couverture n'est pas encore universelle, surtout en dehors des grands centres.
          - generic [ref=e149]:
            - generic [ref=e151]:
              - heading "💬 En termes simples" [level=2] [ref=e152]
              - paragraph [ref=e153]: Imagine la 4G comme une autoroute à deux voies, fluide mais sujette aux bouchons. La 5G, c'est une autoroute à voies multiples où chaque véhicule file sans jamais freiner.
            - generic [ref=e155]:
              - heading "🎯 Exemple concret" [level=2] [ref=e156]
              - paragraph [ref=e157]: Quand tu regardes un match en direct sur ton cellulaire en 5G, l'image reste fluide même dans un stade bondé où des milliers de personnes utilisent leur téléphone en même temps.
            - generic [ref=e159]:
              - heading "💡 Le saviez-vous ?" [level=2] [ref=e160]
              - paragraph [ref=e161]: Le nom technique officiel de la 5G est « IMT-2020 », car ses spécifications ont été coordonnées par l'Union internationale des télécommunications, avec une finalisation visée pour 2020.
