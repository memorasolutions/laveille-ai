                - paragraph [ref=e498]: "SUJET 1 - Confirmation copie presse-papiers (partout sur le site) : le bouton \"Copier\" change visuellement en \"Copié !\" (aria-hidden=\"true\", visuel seulement, pas d'annonce screen-reader propre) ET un toast global (déjà existant site-wide, role=\"status\" persistant dans le DOM depuis le chargement de la page) est la SEULE source d'annonce aria-live, pour éviter la double-annonce screen-reader. Fallback \"Copie impossible\" en cas d'échec (ex: permission navigateur refusée)."
                - paragraph [ref=e499]
                - paragraph [ref=e500]: "SUJET 2 - Lien court dans un outil de sondage collectif (Decido) : champ slug personnalisé minimal inline pour utilisateurs connectés (réutilise exactement la validation du module ShortUrl existant du site : alpha_dash, unique en base, liste de mots réservés), auto-génère un slug aléatoire de 6 caractères si le champ est laissé vide, PLUS un lien \"Options avancées\" qui renvoie vers l'outil Raccourcisseur d'URL déjà existant du site (/raccourcir) pour éditer tags/UTM/expiration/mot de passe après coup. Domaine : affiché en texte fixe discret (pas de menu déroulant), car 0 domaine secondaire n'est configuré actuellement en base sur ce site (un seul domaine réel existe) - le sélecteur de domaine sera ajouté seulement si/quand des domaines secondaires existent réellement."
